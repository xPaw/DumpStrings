name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: DumpStrings
            asset_name: DumpStrings-linux-amd64
          - os: windows-latest
            artifact_name: DumpStrings.exe
            asset_name: DumpStrings-windows-amd64.exe
          - os: macos-latest
            artifact_name: DumpStrings
            asset_name: DumpStrings-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build binary
      run: go build -v -o ${{ matrix.artifact_name }} .

    - name: Test on self
      run: ./${{ matrix.artifact_name }} --binary=${{ matrix.artifact_name }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.artifact_name }}
