name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: DumpStrings
            asset_name: DumpStrings-linux-amd64
          - os: windows-latest
            artifact_name: DumpStrings.exe
            asset_name: DumpStrings-windows-amd64.exe
          - os: macos-latest
            artifact_name: DumpStrings
            asset_name: DumpStrings-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build binary
      run: go build -v -o ${{ matrix.artifact_name }} .

    - name: Run tests
      run: go test ./...

    - name: Test on self
      shell: bash
      run: |
        exe=./${{ matrix.artifact_name }}
        "$exe" dump "$exe" > /dev/null
        "$exe" dump -sort "$exe" > /dev/null
        "$exe" version

    - name: Check the Go end-of-string rule on self
      shell: bash
      run: |
        exe=./${{ matrix.artifact_name }}
        auto=$("$exe" dump -terminated=auto "$exe" 2> auto.err | wc -l)
        off=$("$exe" dump -terminated=off "$exe" 2> /dev/null | wc -l)
        grep -q 'note: Go binary' auto.err
        test "$auto" -eq "$off"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.artifact_name }}
